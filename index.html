<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Itinerarium — Dünya Gezi Planlayıcı</title>
<meta name="theme-color" content="#1c1913">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itinerarium">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1913;
    --bg-alt:#242019;
    --paper:#f3ecdc;
    --paper-shadow:#d9cfb4;
    --ink:#2a2119;
    --marble:#ece4d3;
    --marble-dim:#b9ae97;
    --gold:#c9a227;
    --gold-soft:#8f7420;
    --rosso:#a04434;
    --pino:#46583f;
    --rosa:#c98a7d;
    --blu:#5f7d8c;
    --line:rgba(236,228,211,0.14);
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #2a2419 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, #241f16 0%, transparent 60%),
      var(--bg);
    color:var(--marble);
    font-family:'Jost', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:color 0.3s ease;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 24px 80px;}

  /* ---------- HERO ---------- */
  .hero{
    padding:56px 24px 40px;
    text-align:center;
    position:relative;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--gold);
    margin-bottom:18px;
    transition:color 0.3s ease;
  }
  .hero h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(52px,10vw,96px);
    line-height:0.95;
    margin:0 0 10px;
    color:var(--marble);
    letter-spacing:0.01em;
  }
  .hero .sub{
    font-size:15px;
    color:var(--marble-dim);
    max-width:480px;
    margin:0 auto 26px;
    line-height:1.6;
  }
  .hero-svg-wrap{
    width:min(90%,560px);
    margin:8px auto 4px;
  }
  .hero-svg-wrap svg{width:100%;height:auto;opacity:0.9;display:block;}
  .title-edit{
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--marble-dim);
    color:var(--marble-dim);
    font-family:'Jost',sans-serif;
    font-size:13px;
    text-align:center;
    padding:4px 2px;
    max-width:420px;
    width:100%;
  }
  .title-edit:focus{outline:none;border-bottom-color:var(--gold);}

  /* ---------- SETUP BAR ---------- */
  .setup{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    justify-content:center;
    background:var(--bg-alt);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:40px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--marble-dim);
  }
  input, select, textarea{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--marble);
    font-family:'Jost',sans-serif;
    font-size:14px;
    padding:9px 11px;
    border-radius:var(--radius);
  }
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--gold);}
  input[type="date"], input[type="time"]{font-family:'IBM Plex Mono',monospace; font-size:13px;}
  input[type="number"]{width:90px;}
  #countrySelect, #citySelect{min-width:150px;}

  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    padding:10px 18px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.3s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--gold);color:var(--bg);}
  .btn.primary{background:var(--gold);color:var(--bg);}
  .btn.primary:hover{background:var(--gold-soft);border-color:var(--gold-soft);}
  .btn.ghost{border-color:var(--marble-dim);color:var(--marble-dim);}
  .btn.ghost:hover{background:var(--marble-dim);color:var(--bg);}
  .btn.small{padding:6px 10px;font-size:10px;}
  .btn.danger{border-color:var(--rosso);color:var(--rosso);}
  .btn.danger:hover{background:var(--rosso);color:var(--marble);}

  /* ---------- DAY TICKETS ---------- */
  .days-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:6px 4px 18px;
    margin-bottom:8px;
    -webkit-overflow-scrolling:touch;
  }
  .days-row::-webkit-scrollbar{height:6px;}
  .days-row::-webkit-scrollbar-thumb{background:var(--line);}

  .ticket{
    flex:0 0 auto;
    position:relative;
    background:var(--paper);
    color:var(--ink);
    min-width:118px;
    padding:14px 16px 12px;
    cursor:pointer;
    border-radius:var(--radius);
    box-shadow:0 4px 0 var(--paper-shadow);
    transform:translateY(0);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    border:1px solid rgba(0,0,0,0.06);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:14px;height:14px;
    background:var(--bg);
    border-radius:50%;
    top:50%;
    transform:translateY(-50%);
  }
  .ticket::before{left:-8px;}
  .ticket::after{right:-8px;}
  .ticket:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--paper-shadow);}
  .ticket.active{
    background:var(--gold);
    box-shadow:0 4px 0 var(--gold-soft);
  }
  .ticket .roman{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:26px;
    line-height:1;
    display:block;
  }
  .ticket .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    opacity:0.75;
    margin-top:6px;
    display:block;
  }
  .ticket .count{
    position:absolute;
    top:8px; right:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    opacity:0.55;
  }

  /* ---------- DAY PANEL ---------- */
  .day-panel{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--bg-alt);
    padding:30px 30px 26px;
    animation:fadeIn 0.28s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:22px;
  }
  .day-head h2{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:34px;
    margin:0;
    color:var(--marble);
  }
  .day-head .weekday{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.1em;
  }

  /* ---------- TIMELINE ---------- */
  .timeline{
    position:relative;
    padding-left:26px;
    margin-bottom:22px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:5px; top:6px; bottom:6px;
    width:1px;
    background:var(--line);
  }
  .empty-note{
    font-size:13px;
    color:var(--marble-dim);
    font-style:italic;
    padding:10px 0 10px 26px;
  }
  .item{
    position:relative;
    display:grid;
    grid-template-columns:64px 1fr auto;
    gap:14px;
    align-items:start;
    padding:14px 14px;
    margin-bottom:10px;
    background:rgba(236,228,211,0.03);
    border:1px solid var(--line);
    border-radius:var(--radius);
    border-left:3px solid var(--cat-color, var(--gold));
  }
  .item::before{
    content:"";
    position:absolute;
    left:-25px; top:20px;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--cat-color, var(--gold));
    box-shadow:0 0 0 3px var(--bg-alt);
  }
  .item .time{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    color:var(--marble);
    padding-top:2px;
  }
  .item .body h3{
    font-family:'Jost',sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 4px;
    color:var(--marble);
  }
  .item .meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    font-size:12px;
    color:var(--marble-dim);
    margin-bottom:4px;
  }
  .item .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:2px 7px;
    border-radius:20px;
    color:var(--bg);
    background:var(--cat-color, var(--gold));
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .item .note{
    font-size:13px;
    color:var(--marble-dim);
    line-height:1.5;
    margin-top:4px;
  }
  .item .photo{
    margin-top:10px;
    max-width:220px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    cursor:zoom-in;
  }
  .item .photo img{
    display:block;
    width:100%;
    height:auto;
  }
  .lightbox{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,8,5,0.88);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:30px;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:90vw;
    max-height:85vh;
    border-radius:var(--radius);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .photo-upload{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .photo-upload label.pick{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    border:1px dashed var(--line);
    color:var(--marble-dim);
    padding:9px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    white-space:nowrap;
  }
  .photo-upload label.pick:hover{border-color:var(--gold);color:var(--gold);}
  .photo-upload .thumb{
    width:40px;height:40px;
    border-radius:var(--radius);
    object-fit:cover;
    border:1px solid var(--line);
    display:none;
  }
  .photo-upload input[type="file"]{display:none;}
  .item .actions{
    display:flex;
    gap:6px;
  }
  .icon-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--marble-dim);
    width:28px;height:28px;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.15s ease;
  }
  .icon-btn:hover{border-color:var(--gold);color:var(--gold);}
  .icon-btn.del:hover{border-color:var(--rosso);color:var(--rosso);}
  .icon-btn svg{width:14px;height:14px;}

  /* ---------- ADD FORM ---------- */
  .add-toggle{
    width:100%;
    text-align:left;
    background:transparent;
    border:1px dashed var(--line);
    color:var(--marble-dim);
    padding:12px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:'Jost',sans-serif;
    font-size:13px;
    transition:all 0.15s ease;
  }
  .add-toggle:hover{border-color:var(--gold);color:var(--gold);}
  .add-form{
    margin-top:14px;
    padding:18px;
    background:rgba(0,0,0,0.15);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:none;
  }
  .add-form.open{display:block;animation:fadeIn 0.2s ease;}
  .add-grid{
    display:grid;
    grid-template-columns:110px 1fr 140px;
    gap:12px;
    margin-bottom:12px;
  }
  .add-grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  textarea{resize:vertical;min-height:44px;font-family:'Jost',sans-serif;width:100%;}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;}

  /* ---------- FOOTER ---------- */
  .footer{
    margin-top:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .footer .stat{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--marble-dim);
  }
  .footer .actions{display:flex;gap:10px;flex-wrap:wrap;}
  #fileInput{display:none;}

  /* ---------- YAZDIRMA (PRINT) STİLLERİ ---------- */
  @media print {
    body, html { background: white !important; color: black !important; font-family: 'Jost', sans-serif; }
    .wrap { display: none !important; }
    #printArea { display: block !important; padding: 20px; }
    #printArea h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 38px; margin-bottom: 5px; text-align: center; color: black; }
    #printArea h3 { font-family: 'Jost', sans-serif; font-weight: 400; color: #444; margin-top: 0; margin-bottom: 40px; text-align: center; }
    .print-day { margin-bottom: 35px; page-break-inside: avoid; }
    .print-day h2 { font-family: 'Cormorant Garamond', serif; font-style: italic; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 15px; color: black; }
    .print-item { margin-bottom: 15px; padding-left: 15px; border-left: 2px solid #000; page-break-inside: avoid; }
    .print-item strong { font-family: 'IBM Plex Mono', monospace; margin-right: 10px; }
    .print-title { font-size: 16px; font-weight: 600; }
    .print-meta { font-size: 11px; color: #555; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
    .print-note { font-size: 13px; margin-top: 4px; color: #333; }
    .print-empty { color: #777; font-style: italic; }
  }
  #printArea { display: none; }

  @media (max-width:640px){
    .add-grid{grid-template-columns:1fr;}
    .add-grid2{grid-template-columns:1fr;}
    .item{grid-template-columns:52px 1fr;}
    .item .actions{grid-column:1/-1;justify-content:flex-end;}
    .day-panel{padding:22px 16px;}
    .setup{padding:16px;}
    #countrySelect, #citySelect{min-width:0;width:100%;}
  }

  @media (display-mode: standalone){
    .wrap{padding-top:env(safe-area-inset-top);}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow" id="eyebrow">ITINERARIUM · ROMA</div>
    <h1 id="cityTitle">Roma</h1>
    <div class="hero-svg-wrap" id="heroSvgWrap"></div>
    <p class="sub">Sizin için kurgulanan, saat saat ilerleyen bir yol arkadaşı. Her gün bir bilet, her bilet bir hatıra.</p>
    <input class="title-edit" id="tripSubtitle" type="text" value="" />
  </div>

  <div class="setup">
    <div class="field">
      <label for="countrySelect">Ülke</label>
      <select id="countrySelect"></select>
    </div>
    <div class="field">
      <label for="citySelect">Şehir</label>
      <select id="citySelect"></select>
    </div>
    <div class="field">
      <label for="startDate">Başlangıç Tarihi</label>
      <input type="date" id="startDate">
    </div>
    <div class="field">
      <label for="dayCount">Gün Sayısı</label>
      <input type="number" id="dayCount" min="1" max="14" value="5">
    </div>
    <button class="btn primary" id="buildBtn">Planı Oluştur / Güncelle</button>
  </div>

  <div class="days-row" id="daysRow"></div>

  <div class="day-panel" id="dayPanel"></div>

  <div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

  <div class="footer">
    <div class="stat" id="statLine">0 aktivite planlandı</div>
    <div class="actions">
      <button class="btn ghost small" id="printBtn">Yazdır</button>
      <button class="btn ghost small" id="exportBtn">Planı İndir (.json)</button>
      <button class="btn ghost small" id="importBtn">Planı Yükle</button>
      <input type="file" id="fileInput" accept="application/json">
    </div>
  </div>
</div>

<script>
/* ---------------- ICONS ---------------- */
const ICONS = {
  muze: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M4 21V10M20 21V10M2 10l10-6 10 6M6 10v7M10 10v7M14 10v7M18 10v7"/></svg>',
  yemek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2v8a2 2 0 002 2 2 2 0 002-2V2M8 12v10M16 2c-1.5 1.5-2 3-2 5s.5 3.5 2 5v9"/></svg>',
  gezi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.5-7-11.5A7 7 0 0119 9.5C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>',
  manzara: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 17.5s-6-4-6-8.2A6 6 0 0112 3a6 6 0 016 6.3c0 4.2-6 8.2-6 8.2z"/><path d="M9 9.3l2 2 4-4"/></svg>',
  ulasim: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 12h16M8 20l-1.5 2M16 20l1.5 2"/><circle cx="8" cy="16" r="0.5" fill="currentColor"/><circle cx="16" cy="16" r="0.5" fill="currentColor"/></svg>'
};
const CATS = {
  muze:   {label:'Müze',           color:'var(--pino)'},
  yemek:  {label:'Yemek',          color:'var(--rosa)'},
  gezi:   {label:'Gezi / Yürüyüş', color:'var(--gold)'},
  manzara:{label:'Manzara / Özel', color:'var(--rosso)'},
  ulasim: {label:'Ulaşım',         color:'var(--blu)'}
};
const TR_DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TR_MONTHS = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function toRoman(n){
  const map=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let res=''; for(const [v,s] of map){ while(n>=v){res+=s; n-=v;} } return res;
}
function fmtDate(d){ return `${d.getDate()} ${TR_MONTHS[d.getMonth()]}`; }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------- DESTINATIONS & TAM 5 GÜNLÜK PLANLAR ---------------- */
const DESTINATIONS = {
  roma: {
    countryId:'it', country:'İtalya', city:'Roma', eyebrowCountry:'ROMA', accent:'#c9a227', accentSoft:'#8f7420', defaultSubtitle:'Roma Antik Miras Gezisi',
    hero:`<svg viewBox="0 0 600 90" xmlns="http://www.w3.org/2000/svg"><g stroke="var(--gold)" stroke-width="1.2" opacity="0.85" fill="none"><path d="M40 88 Q40 20 300 20 Q560 20 560 88" /><path d="M55 88 Q55 34 300 34 Q545 34 545 88" /><path d="M70 88 Q70 48 300 48 Q530 48 530 88" /><path d="M85 88 Q85 60 300 60 Q515 60 515 88" /></g><g stroke="var(--gold)" stroke-width="0.8" opacity="0.6" fill="none"><path d="M100 88 L100 62 M124 88 L124 55 M148 88 L148 49 M172 88 L172 45 M196 88 L196 42 M220 88 L220 40 M244 88 L244 38.5 M268 88 L268 37.5 M300 88 L300 37 M332 88 L332 37.5 M356 88 L356 38.5 M380 88 L380 40 M404 88 L404 42 M428 88 L428 45 M452 88 L452 49 M476 88 L476 55 M500 88 L500 62"/></g></svg>`,
    samples:[

      [{time:'11:00', title:'Chhatrapati İstasyonu', cat:'gezi', place:'Fort', note:''}]

};

/* ---------------- STATE ---------------- */
let state = { destination:'roma', subtitle:'', days: [] };
let activeDay = 0;

// Yeni sürüm anahtarı: Tüm kullanıcıların eski boş planlarını sıfırlamak için
const STORAGE_KEY = 'itinerarium-world-v2';

function defaultStart(){
  const d = new Date(); d.setDate(d.getDate()+21);
  return d.toISOString().slice(0,10);
}

function buildDays(startStr, count, preserve){
  const start = new Date(startStr+'T00:00:00');
  const newDays = [];
  for(let i=0;i<count;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const old = preserve && preserve[i] ? preserve[i].activities : [];
    newDays.push({ date:d.toISOString().slice(0,10), activities: old });
  }
  return newDays;
}

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { selected:'roma', trips:{} };
    const parsed = JSON.parse(raw);
    if(!parsed.trips) parsed.trips = {};
    return parsed;
  }catch(e){ return { selected:'roma', trips:{} }; }
}

function saveStore(){
  try{
    const store = loadStore();
    store.selected = state.destination;
    store.trips[state.destination] = { subtitle: state.subtitle, days: state.days };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }catch(e){ }
}

function makeDefaultTrip(destId){
  const dest = DESTINATIONS[destId];
  const days = buildDays(defaultStart(), 5, null);
  if(dest.samples){
    dest.samples.forEach((acts, i)=>{
      if(days[i]) days[i].activities = acts.map(a=>({ id:uid(), ...a, photo:null }));
    });
  }
  return { subtitle: dest.defaultSubtitle, days };
}

function applyDestination(destId, opts){
  opts = opts || {};
  const store = loadStore();
  const dest = DESTINATIONS[destId];
  state.destination = destId;

  document.documentElement.style.setProperty('--gold', dest.accent);
  document.documentElement.style.setProperty('--gold-soft', dest.accentSoft);
  document.getElementById('eyebrow').textContent = 'ITINERARIUM · ' + dest.eyebrowCountry;
  document.getElementById('cityTitle').textContent = dest.city;
  document.getElementById('heroSvgWrap').innerHTML = dest.hero;
  document.getElementById('countrySelect').value = dest.countryId;
  populateCitySelect(dest.countryId, destId);

  const saved = store.trips[destId];
  const trip = saved || makeDefaultTrip(destId);
  state.subtitle = trip.subtitle;
  state.days = trip.days;
  document.getElementById('tripSubtitle').value = trip.subtitle;
  document.getElementById('startDate').value = trip.days[0] ? trip.days[0].date : defaultStart();
  document.getElementById('dayCount').value = trip.days.length || 5;
  activeDay = 0;
  renderAll();
}

function getCountries(){
  const list = [];
  const seen = {};
  Object.keys(DESTINATIONS).forEach(id=>{
    const d = DESTINATIONS[id];
    if(!seen[d.countryId]){
      seen[d.countryId] = true;
      list.push({ id: d.countryId, name: d.country });
    }
  });
  return list;
}

function populateCountrySelect(){
  const sel = document.getElementById('countrySelect');
  sel.innerHTML = getCountries().map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  sel.addEventListener('change', ()=>{
    const countryId = sel.value;
    const firstCity = Object.keys(DESTINATIONS).find(id=>DESTINATIONS[id].countryId===countryId);
    saveStore();
    applyDestination(firstCity);
  });
}

function populateCitySelect(countryId, selectedCityId){
  const sel = document.getElementById('citySelect');
  const cityIds = Object.keys(DESTINATIONS).filter(id=>DESTINATIONS[id].countryId===countryId);
  sel.innerHTML = cityIds.map(id=>`<option value="${id}">${DESTINATIONS[id].city}</option>`).join('');
  sel.value = selectedCityId;
}

document.getElementById('citySelect').addEventListener('change', ()=>{
  saveStore();
  applyDestination(document.getElementById('citySelect').value);
});

function init(){
  populateCountrySelect();
  const store = loadStore();
  const startId = DESTINATIONS[store.selected] ? store.selected : 'roma';
  applyDestination(startId);
}

/* ---------------- RENDER ---------------- */
function renderAll(){
  renderDaysRow();
  renderDayPanel();
  renderStats();
  saveStore();
}

function renderDaysRow(){
  const row = document.getElementById('daysRow');
  row.innerHTML = '';
  state.days.forEach((day, idx)=>{
    const d = new Date(day.date+'T00:00:00');
    const el = document.createElement('div');
    el.className = 'ticket' + (idx===activeDay ? ' active' : '');
    el.innerHTML = `
      <span class="count">${day.activities.length || ''}</span>
      <span class="roman">${toRoman(idx+1)}</span>
      <span class="date">${fmtDate(d)}</span>
    `;
    el.addEventListener('click', ()=>{ activeDay = idx; renderAll(); });
    row.appendChild(el);
  });
}

function renderDayPanel(){
  const panel = document.getElementById('dayPanel');
  const day = state.days[activeDay];
  if(!day){ panel.innerHTML = '<p class="empty-note">Önce bir plan oluşturun.</p>'; return; }
  const d = new Date(day.date+'T00:00:00');
  const sorted = [...day.activities].sort((a,b)=> a.time.localeCompare(b.time));

  let itemsHtml = '';
  if(sorted.length===0){
    itemsHtml = '<p class="empty-note">Bu gün için henüz bir şey planlanmadı.</p>';
  } else {
    itemsHtml = sorted.map(a=>{
      const cat = CATS[a.cat] || CATS.gezi;
      return `
      <div class="item" style="--cat-color:${cat.color}">
        <div class="time">${a.time}</div>
        <div class="body">
          <h3>${escapeHtml(a.title)}</h3>
          <div class="meta">
            <span class="tag">${ICONS[a.cat]||''} ${cat.label}</span>
            ${a.place ? `<span>· ${escapeHtml(a.place)}</span>` : ''}
          </div>
          ${a.note ? `<div class="note">${escapeHtml(a.note)}</div>` : ''}
          ${a.photo ? `<div class="photo" data-photo="${a.photo}"><img src="${a.photo}" alt="${escapeHtml(a.title)}"></div>` : ''}
        </div>
        <div class="actions">
          <button class="icon-btn edit" title="Düzenle" data-edit="${a.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
          <button class="icon-btn del" title="Sil" data-del="${a.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          </button>
        </div>
      </div>`;
    }).join('');
  }

  panel.innerHTML = `
    <div class="day-head">
      <h2>${toRoman(activeDay+1)}. Gün — ${fmtDate(d)}</h2>
      <span class="weekday">${TR_DAYS[d.getDay()]}</span>
    </div>
    <div class="timeline">${itemsHtml}</div>
    <button class="add-toggle" id="addToggle">+ Aktivite ekle</button>
    <div class="add-form" id="addForm">
      <div class="add-form-head" id="addFormHead" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;">Yeni Aktivite</div>
      <div class="add-grid">
        <div class="field"><label>Saat</label><input type="time" id="f-time" value="10:00"></div>
        <div class="field"><label>Başlık</label><input type="text" id="f-title" placeholder="ör. Pantheon ziyareti"></div>
        <div class="field"><label>Kategori</label>
          <select id="f-cat">
            ${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="add-grid2">
        <div class="field"><label>Konum</label><input type="text" id="f-place" placeholder="ör. Piazza della Rotonda"></div>
        <div class="field"><label>Not</label><input type="text" id="f-note" placeholder="küçük bir hatırlatma..."></div>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Fotoğraf</label>
        <div class="photo-upload">
          <label class="pick" for="f-photo">Fotoğraf seç</label>
          <input type="file" id="f-photo" accept="image/*">
          <img class="thumb" id="f-photo-thumb">
          <button class="btn ghost small" id="f-photo-clear" style="display:none;">Kaldır</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn ghost small" id="cancelAdd">Vazgeç</button>
        <button class="btn primary small" id="confirmAdd">Ekle</button>
      </div>
    </div>
  `;

  document.getElementById('addToggle').addEventListener('click', ()=>{
    editingId = null;
    resetForm();
    document.getElementById('addForm').classList.add('open');
    document.getElementById('addToggle').style.display='none';
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=>{
    editingId = null;
    document.getElementById('addForm').classList.remove('open');
    document.getElementById('addToggle').style.display='block';
  });
  document.getElementById('confirmAdd').addEventListener('click', addActivity);

  panel.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-edit');
      const a = day.activities.find(x=>x.id===id);
      if(!a) return;
      editingId = id;
      document.getElementById('addFormHead').textContent = 'Aktiviteyi Düzenle';
      document.getElementById('confirmAdd').textContent = 'Kaydet';
      document.getElementById('f-time').value = a.time;
      document.getElementById('f-title').value = a.title;
      document.getElementById('f-cat').value = a.cat;
      document.getElementById('f-place').value = a.place || '';
      document.getElementById('f-note').value = a.note || '';
      pendingPhoto = a.photo || null;
      const thumb = document.getElementById('f-photo-thumb');
      const clearBtn = document.getElementById('f-photo-clear');
      if(pendingPhoto){
        thumb.src = pendingPhoto;
        thumb.style.display = 'block';
        clearBtn.style.display = 'inline-block';
      }
      document.getElementById('addForm').classList.add('open');
      document.getElementById('addToggle').style.display='none';
      document.getElementById('addForm').scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });

  pendingPhoto = null;
  const photoInput = document.getElementById('f-photo');
  const photoThumb = document.getElementById('f-photo-thumb');
  const photoClear = document.getElementById('f-photo-clear');
  photoInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      pendingPhoto = ev.target.result;
      photoThumb.src = pendingPhoto;
      photoThumb.style.display = 'block';
      photoClear.style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  });
  photoClear.addEventListener('click', ()=>{
    pendingPhoto = null;
    photoInput.value = '';
    photoThumb.style.display = 'none';
    photoClear.style.display = 'none';
  });

  panel.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-del');
      day.activities = day.activities.filter(a=>a.id!==id);
      renderAll();
    });
  });

  panel.querySelectorAll('[data-photo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      openLightbox(el.getAttribute('data-photo'));
    });
  });
}

let pendingPhoto = null;
let editingId = null;

function resetForm(){
  document.getElementById('addFormHead').textContent = 'Yeni Aktivite';
  document.getElementById('confirmAdd').textContent = 'Ekle';
  document.getElementById('f-time').value = '10:00';
  document.getElementById('f-title').value = '';
  document.getElementById('f-cat').value = 'gezi';
  document.getElementById('f-place').value = '';
  document.getElementById('f-note').value = '';
  pendingPhoto = null;
  document.getElementById('f-photo').value = '';
  document.getElementById('f-photo-thumb').style.display = 'none';
  document.getElementById('f-photo-clear').style.display = 'none';
}

function addActivity(){
  const time = document.getElementById('f-time').value || '00:00';
  const title = document.getElementById('f-title').value.trim();
  const cat = document.getElementById('f-cat').value;
  const place = document.getElementById('f-place').value.trim();
  const note = document.getElementById('f-note').value.trim();
  if(!title){ document.getElementById('f-title').focus(); return; }

  if(editingId){
    const day = state.days[activeDay];
    const a = day.activities.find(x=>x.id===editingId);
    if(a){
      a.time = time; a.title = title; a.cat = cat; a.place = place; a.note = note; a.photo = pendingPhoto;
    }
    editingId = null;
  } else {
    state.days[activeDay].activities.push({ id:uid(), time, title, cat, place, note, photo:pendingPhoto });
  }
  pendingPhoto = null;
  renderAll();
}

function openLightbox(src){
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  lb.classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('open');
});

function renderStats(){
  const total = state.days.reduce((s,d)=>s+d.activities.length,0);
  document.getElementById('statLine').textContent = `${state.days.length} gün · ${total} aktivite planlandı`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------------- CONTROLS ---------------- */
document.getElementById('buildBtn').addEventListener('click', ()=>{
  const start = document.getElementById('startDate').value || defaultStart();
  const count = Math.max(1, Math.min(14, parseInt(document.getElementById('dayCount').value)||1));
  state.days = buildDays(start, count, state.days);
  if(activeDay >= state.days.length) activeDay = 0;
  renderAll();
});

document.getElementById('printBtn').addEventListener('click', ()=>{
  let printDiv = document.getElementById('printArea');
  if(!printDiv){
    printDiv = document.createElement('div');
    printDiv.id = 'printArea';
    document.body.appendChild(printDiv);
  }
  
  const cityTitle = document.getElementById('cityTitle').textContent;
  const subtitle = document.getElementById('tripSubtitle').value;

  let html = `
    <div>
      <h1>${escapeHtml(cityTitle)} Planı</h1>
      <h3>${escapeHtml(subtitle)}</h3>
    </div>
  `;

  state.days.forEach((day, i) => {
    const d = new Date(day.date+'T00:00:00');
    const sorted = [...day.activities].sort((a,b)=> a.time.localeCompare(b.time));

    html += `<div class="print-day">
               <h2>${toRoman(i+1)}. Gün — ${fmtDate(d)}</h2>`;

    if(sorted.length === 0){
       html += `<p class="print-empty">Bu gün için planlanmış aktivite yok.</p>`;
    } else {
       sorted.forEach(a => {
         const catLabel = CATS[a.cat]?.label || '';
         html += `
           <div class="print-item">
             <div>
               <strong>${a.time}</strong>
               <span class="print-title">${escapeHtml(a.title)}</span>
             </div>
             <div class="print-meta">
               ${catLabel} ${a.place ? `&nbsp;·&nbsp; ${escapeHtml(a.place)}` : ''}
             </div>
             ${a.note ? `<div class="print-note">${escapeHtml(a.note)}</div>` : ''}
           </div>
         `;
       });
    }
    html += `</div>`;
  });

  printDiv.innerHTML = html;
  window.print();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const subtitle = document.getElementById('tripSubtitle').value;
  const data = JSON.stringify({ destination: state.destination, subtitle, days: state.days }, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${state.destination}-gezi-plani.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.days){
        const destId = DESTINATIONS[data.destination] ? data.destination : state.destination;
        state.destination = destId;
        state.days = data.days;
        state.subtitle = data.subtitle || DESTINATIONS[destId].defaultSubtitle;
        activeDay = 0;
        applyDestination(destId, {skipLoad:true});
        state.days = data.days;
        state.subtitle = data.subtitle || state.subtitle;
        document.getElementById('tripSubtitle').value = state.subtitle;
        if(state.days[0]) document.getElementById('startDate').value = state.days[0].date;
        document.getElementById('dayCount').value = state.days.length;
        renderAll();
      }
    }catch(err){ alert('Dosya okunamadı: geçerli bir plan dosyası seçtiğinizden emin olun.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

init();
document.getElementById('tripSubtitle').addEventListener('input', ()=>{
  state.subtitle = document.getElementById('tripSubtitle').value;
  saveStore();
});
</script>
